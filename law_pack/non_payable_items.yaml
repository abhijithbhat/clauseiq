notes: >
  Historical schedule comprises 146 standard items divided across four distinct lists:
  List I: 68 optional items (optional-cover category, not a universal exclusion; liability must be checked against policy wording).
  List II: 37 items subsumed into room charges (e.g. admission kit, bed pan, face mask, gown, shoe cover, visitor pass).
  List III: 23 items subsumed into procedure charges (e.g. hair removal cream, disposable razors, surgical drapes/tapes).
  List IV: 18 items subsumed into treatment costs (e.g. diagnostic hospitalisation, urine containers, infusion pump cost).
  Status remains explicitly PENDING_VERIFICATION as an incomplete historical reference.
  Engine Rule R7 must NOT make definitive deductions or verdicts based solely on this incomplete catalogue and must return UNKNOWN when items are unverified in policy schedules.

