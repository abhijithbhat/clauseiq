# Law Pack Manifest
# Regulatory and primary source manifest for ClauseIQ v0.1
version: "0.1.0"
documents:
  - id: "irdai_insurance_products_regulations_2024"
    title: "IRDAI (Insurance Products) Regulations, 2024"
    notification_ref: "F. No. IRDAI/Reg/8/202/2024"
    notification_date: "2024-03-20"
    gazette_date: "2024-03-22"
    source_url: "https://irdai.gov.in/document-detail?documentId=4878298"
    version: "2024"
    status: "verified"
    relevant_provisions:
      - "Schedule III, Para 1.3: Grace period (15 days for monthly mode; 30 days for other modes; preserves renewal continuity)"
      - "Schedule III, Para 1.6: Pre-Existing Disease (PED) definition (36 months prior to policy commencement date)"
      - "Schedule III, Para 1.7: Specific waiting period definition (with statutory accident exemption)"
      - "Schedule III, Para 7: Pre-Existing Disease maximum waiting period capped at 36 months"
      - "Schedule III, Para 8: Moratorium period of 60 continuous months"

  - id: "irdai_master_circular_health_2024"
    title: "Master Circular on Health Insurance Business"
    circular_ref: "IRDAI/HLT/CIR/PRO/84/5/2024"
    circular_date: "2024-05-29"
    source_url: "https://irdai.gov.in/document-detail?documentId=5055047"
    version: "2024-05"
    status: "verified"
    relevant_provisions:
      - "Standardisation of health insurance terms"
      - "Portability, migration and continuous coverage credits"
      - "Annexure 6: Explicit list of superseded circulars (including 151/06/2020 and 193/07/2020)"

  - id: "irdai_master_circular_policyholders_2024"
    title: "Master Circular on Protection of Policyholders' Interests"
    circular_ref: "IRDAI/PP&GR/CIR/MISC/117/9/2024"
    circular_date: "2024-09-05"
    source_url: "https://irdai.gov.in/document-detail?documentId=5541604"
    version: "2024-09"
    status: "verified"
    relevant_provisions:
      - "Section VI, Paragraph 2: Insurer grievance resolution turnaround time of 14 days"
      - "Section VI.3(i): Insurance Ombudsman claim amount jurisdiction limit of ₹50,00,000 (₹50 Lakhs)"
      - "Mandate: Claims shall not be rejected or closed merely for want of documents or delayed claim intimation"
      - "Mandate: Insurers and TPAs must collect hospital records directly from hospitals (not restricted to network hospitals only)"
      - "Mandatory disclosure of proportionate deduction mechanisms and policy sections"

  - id: "insurance_ombudsman_rules_2017_amended_2023"
    title: "Insurance Ombudsman Rules, 2017 (as amended by G.S.R. 828(E) dated 9 November 2023)"
    notification_ref: "G.S.R. 828(E)"
    notification_date: "2023-11-09"
    gazette_date: "2023-11-09"
    source_url: "https://www.cioins.co.in/OmbudsmanRules"
    version: "2023-11"
    status: "verified"
    relevant_provisions:
      - "Rule 14(3)(a)(ii): Ombudsman no-response prerequisite wait of 1 month after insurer receives representation"
      - "Rule 14(3)(b)(i)-(ii): 1-year limitation from date of receipt of rejection or unsatisfactory reply"
      - "Rule 14(3)(b)(iii): 1-year limitation in no-response case runs from expiry of 1 month after representation was sent"
      - "Rule 14(4): Ombudsman power to condone delay beyond 1 year upon sufficient cause shown"
      - "Rule 17(3): Compensation award ceiling of ₹50,00,000 (₹50 Lakhs) as amended by G.S.R. 828(E)"

  - id: "insurance_ombudsman_consultation_paper_2025"
    title: "Draft Consultation Paper on Proposed Amendments to Insurance Ombudsman Rules, 2017"
    publication_date: "2025-11"
    status: "draft_consultation_only"
    notes: "Non-operative consultative draft only; not an in-force statutory amendment."

  - id: "irdai_proportionate_deductions_circular_2020"
    title: "Norms on Proportionate Deductions in Health Insurance Policies"
    circular_ref: "IRDAI/HLT/REG/CIR/151/06/2020"
    circular_date: "2020-06-11"
    source_url: "https://irdai.gov.in/document-detail?documentId=385202"
    version: "2020"
    status: "superseded_historical_reference"
    superseded_by: "IRDAI/HLT/CIR/PRO/84/5/2024 (Annexure 6)"
    notes: >
      Explicitly superseded by Master Circular on Health Insurance Business (29 May 2024, Annexure 6).
      Preserved strictly as a historical reference for legacy policies whose wording incorporates these norms
      (e.g., prohibition of proportionate deductions on pharmacy/consumables, implants, diagnostics, and ICU).

